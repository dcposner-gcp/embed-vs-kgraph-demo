# One smoke job, three OSes: fresh clone -> renv::restore -> simulate the
# null-calibration preset straight into data/ -> run the unchanged targets
# pipeline -> assert the headline metrics file exists. This exercises the
# "fresh clone" mode documented in scripts/simulate_data.R (--out data),
# which needs no bash/symlinks/make and therefore also runs on Windows.
#
# RENV_CONFIG_REPOS_OVERRIDE pins the DATED PPM snapshot 2026-06-02 (the day
# after renv.lock was written), where every pinned version was CRAN-current —
# so mac/windows/linux all get prebuilt binaries. The lockfile's own
# "latest" URL drifts: mac/windows binaries exist only for current CRAN
# versions, so pinned-but-superseded packages (e.g. data.table) fall back to
# source builds that fail on the runners. Linux additionally needs the
# __linux__/noble path for binaries at all.
name: smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            repos: https://packagemanager.posit.co/cran/__linux__/noble/2026-06-02
          - os: macos-latest
            repos: https://packagemanager.posit.co/cran/2026-06-02
          - os: windows-latest
            repos: https://packagemanager.posit.co/cran/2026-06-02
    env:
      RENV_CONFIG_REPOS_OVERRIDE: ${{ matrix.repos }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
      - uses: r-lib/actions/setup-renv@v2
      - name: simulate (phecode-null, fresh-clone mode)
        run: Rscript scripts/simulate_data.R --preset phecode-null --out data --force
      - name: run pipeline
        run: Rscript -e 'targets::tar_make(reporter = "balanced")'
      - name: calibration output exists
        run: |
          test -f output/dx/headline_auc_random_1to1.csv
          cat output/dx/headline_auc_random_1to1.csv
