# One smoke job, three OSes: fresh clone -> renv::restore -> simulate the
# null-calibration preset straight into data/ -> run the unchanged targets
# pipeline -> assert the headline metrics file exists. This exercises the
# "fresh clone" mode documented in scripts/simulate_data.R (--out data),
# which needs no bash/symlinks/make and therefore also runs on Windows.
#
# RENV_CONFIG_REPOS_OVERRIDE: the lockfile records the platform-neutral PPM
# URL, which serves mac/windows binaries but only *source* on Linux; the
# ubuntu job overrides to the noble binary path so restore takes minutes,
# not an hour of compilation.
name: smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            repos: https://packagemanager.posit.co/cran/__linux__/noble/latest
          - os: macos-latest
            repos: https://packagemanager.posit.co/cran/latest
          - os: windows-latest
            repos: https://packagemanager.posit.co/cran/latest
    env:
      RENV_CONFIG_REPOS_OVERRIDE: ${{ matrix.repos }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.0"
      - uses: r-lib/actions/setup-renv@v2
      - name: simulate (phecode-null, fresh-clone mode)
        run: Rscript scripts/simulate_data.R --preset phecode-null --out data --force
      - name: run pipeline
        run: Rscript -e 'targets::tar_make(reporter = "balanced")'
      - name: calibration output exists
        run: |
          test -f output/dx/headline_auc_random_1to1.csv
          cat output/dx/headline_auc_random_1to1.csv
